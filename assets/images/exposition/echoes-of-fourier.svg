<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">What Are Echoes?</title>
  <desc id="description">A sound wave followed by progressively smaller delayed echoes on warm paper.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49644f" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#9b9a73" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cb7651" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#f4eddf"/>
  <rect width="1200" height="800" fill="#f7f1e7" opacity="0.32" filter="url(#paper)"/>
  <ellipse cx="310" cy="408" rx="245" ry="265" fill="#71806a" opacity="0.12"/>
  <ellipse cx="860" cy="395" rx="270" ry="245" fill="#d28a67" opacity="0.12"/>
  <path d="M70 400 C120 400 126 220 176 220 S230 590 286 590 S346 132 410 132 S478 642 548 642 S624 278 694 278 S770 520 840 520 S918 330 982 330 S1056 454 1130 454"
        fill="none" stroke="#304c3b" stroke-width="8" stroke-linecap="round" opacity="0.92"/>
  <path d="M265 400 C310 400 322 282 362 282 S412 523 458 523 S514 221 568 221 S628 557 684 557 S748 322 802 322 S866 480 924 480 S990 356 1040 356 S1092 438 1142 438"
        fill="none" stroke="#8e9a76" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <path d="M520 400 C560 400 570 326 604 326 S646 477 686 477 S732 290 778 290 S828 500 874 500 S926 348 970 348 S1020 456 1062 456 S1106 375 1144 375"
        fill="none" stroke="#c76743" stroke-width="4" stroke-linecap="round" opacity="0.58"/>
  <path d="M70 666 C280 614 398 698 600 650 S928 595 1130 652" fill="none" stroke="#69715f" stroke-width="2" opacity="0.25"/>
  <path d="M70 684 C286 630 408 714 606 668 S930 616 1130 670" fill="none" stroke="#c17453" stroke-width="2" opacity="0.2"/>
  <circle cx="176" cy="220" r="9" fill="#304c3b"/>
  <circle cx="410" cy="132" r="9" fill="#304c3b"/>
  <circle cx="568" cy="221" r="7" fill="#7f896e"/>
  <circle cx="778" cy="290" r="6" fill="#b86b49"/>
  <rect x="55" y="92" width="1090" height="620" rx="36" fill="url(#wash)" opacity="0.16"/>
</svg>
